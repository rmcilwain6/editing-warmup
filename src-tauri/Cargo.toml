[package]
name = "teststrip"
version = "0.1.0"
edition = "2021"
metadata = ''

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
notify = "6"
chrono = { version = "0.4", features = ["clock"] }
open = "5"
tauri-plugin-dialog = "2"

[dependencies.tauri]
version = "2"
features = []

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
