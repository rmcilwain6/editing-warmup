[package]
name = "lightroom-warmup"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
notify = "6"
chrono = { version = "0.4", features = ["clock"] }
open = "5"

[dependencies.tauri]
version = "1"
features = ["api-all"]

[features]
custom-protocol = ["tauri/custom-protocol"]
